      - "&7- 영토 점령: 국가원 1명당 최대 &f10청크 &8(국가 메뉴 영토 버튼 우클릭으로 해제)"
      - "&7- 금고에 돈을 넣어 국가 레벨을 올리세요 (최대 Lv.5). 인출은 지도자만 가능"
      - "&7- 신호기는 우리 영토 안으로만 옮길 수 있어요"
      - "&7- 지도자는 국가 메뉴에서 &f국가 이름&7을 바꿀 수 있어요 &8(전쟁 중에는 불가)"
      - "&7- 매일 자정 금고에서 &f유지비&7가 빠져나가요"
      - "&a&l[ 내실 ] &7전쟁 말고도 나라를 키울 수 있어요! &e/국가랭킹 내실"
      - "&7- 퀘스트 완료, 금고 입금, 영토 점령, 업그레이드, 우리 영토에 건축하면 점수가 올라요"
      - "&7- 전쟁 없이 유지비를 내면 매일 &f평화 보너스&7, 1000점이면 &a[태평성대]&7 칭호"
      - "&7- 레벨 효과: Lv.2 신속 / Lv.3 신호기 근처 재생 / Lv.4 저항 / Lv.5 성급함"
      - "&7- &e/국가창고 &7국가원끼리 함께 쓰는 창고 (레벨이 오르면 커짐)"

  war:
    name: "전쟁"
