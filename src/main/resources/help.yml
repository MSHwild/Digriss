# ───────────────────────── 도움말 (/도움말) ─────────────────────────
# 수정 후 /도움말 리로드 로 바로 적용됩니다. (& 색코드 사용 가능)
#
# 카테고리를 지우면 GUI와 /도움말 <이름> 에서 사라집니다.
# 아직 공개하지 않은 기능은 지워두거나 앞에 #을 붙여 숨기세요.
#
# name:  GUI 표시 이름이자 /도움말 <name> 으로 바로 볼 때 쓰는 이름 (색코드 제외)
# icon:  GUI 아이콘 (바닐라 아이템 이름)
# slot:  GUI 칸 번호 (0~26)
# summary: GUI에서 마우스를 올렸을 때 보이는 한 줄 설명
# lines: 클릭하면 채팅으로 나오는 설명

# 처음 접속한 유저에게 보여주는 안내 (비워두면 안 보냄)
first-join:
  - "&6&l디그리스에 오신 것을 환영합니다!"
  - "&e/도움말 &7로 서버 기능을 확인하세요."
  - "&eShift + F &7를 누르면 메뉴가 열려요."

categories:
  start:
    name: "처음 시작"
    icon: OAK_SAPLING
    slot: 10
    summary: "&7처음 오셨다면 여기부터!"
    lines:
      - "&6&l[ 처음 시작 ]"
      - "&e웅크리기(Shift) + F &7를 누르면 모든 메뉴를 한 번에 열 수 있어요!"
      - "&f1. &e/국가 &7로 국가를 만들거나 초대를 받아 가입하세요."
      - "&f2. &e/퀘스트 &7로 일일 퀘스트를 깨서 영혼과 돈을 모으세요."
      - "&f3. 영혼 100개를 모으면 &e/직업 &7에서 직업을 살 수 있어요."
      - "&f4. 다른 국가와 전쟁해서 랭크를 올려보세요!"
      - "&7실시간 지도는 &e/지도&7, 디스코드는 &e/디스코드&7 로 확인할 수 있어요."

  nation:
    name: "국가"
    icon: BEACON
    slot: 11
    summary: "&7건국, 영토, 금고, 레벨, 창고"
