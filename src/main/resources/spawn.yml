# 랜덤 스폰 설정
# 처음 접속한 유저, 그리고 국가가 없는 유저가 죽으면 랜덤 위치로 보냅니다.
# (침대·리스폰 정박기를 설정했으면 그쪽이 우선, 다른 국가 영토와 물·용암 위는 피함)
enabled: true

# 랜덤 스폰할 월드 이름 (비워두면 기본 월드)
world: ""

# 월드 스폰에서 얼마나 떨어진 곳에 내려줄지 (블록)
min-radius: 300
max-radius: 3000

# 직사각형 범위 (지구 맵처럼 가로가 긴 맵용). 설정돼 있으면 위의 반경 대신 이 범위 안에서 랜덤으로 찾습니다.
# 쓰지 않으려면 아래 area 부분을 통째로 지우거나 앞에 #을 붙이세요.
# 기본값: 18432 x 9216 지구 맵(Vanilla-Survival 1:100, 중심 0,0)에서 가장자리 200~300칸을 뺀 범위
# (ChunkyBorder: /chunky shape rectangle → /chunky center 0 0 → /chunky radius 9216 4608 → /chunky border add)
area:
  min-x: -9000
  max-x: 9000
  min-z: -4400
  max-z: 4400
