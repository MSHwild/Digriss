# 전투 중 도주 방지 설정
# 플레이어끼리 피해를 주고받으면 둘 다 "전투 중"이 됩니다.
# 전투 중에 접속을 끊으면 그 자리에서 사망하고(아이템은 떨어짐), 이동 명령어도 막힙니다.
# digriss.combat.bypass 권한이 있는 사람은 전투 표시가 붙지 않습니다 (관리자 테스트용).
# 수정한 뒤에는 서버를 재시작해야 적용됩니다.
enabled: true

# 전투 상태가 유지되는 시간(초). 또 맞거나 때리면 다시 이만큼으로 늘어납니다. (3~120)
seconds: 15

# 전투 중 접속을 끊으면 사망
kill-on-logout: true

# 어떤 종료를 도주로 볼지
#   DISCONNECTED    직접 나감
#   TIMED_OUT       연결이 끊김 (선을 뽑는 수법 방지, 대신 진짜 인터넷 끊김도 사망)
#   KICKED          강퇴 (관리자가 내보낸 경우라 기본은 제외)
punish-reasons:
  - DISCONNECTED
  - TIMED_OUT

# 전투 중에 쓸 수 없는 명령어 (슬래시 없이, 소문자)
blocked-commands:
  - tpa
  - tpahere
  - tpaccept
  - tpyes
  - tpask
  - call
  - tpr
  - tp
  - etp
  - tphere
  - etphere
  - tpo
  - tppos
  - tpall
  - home
  - ehome
  - spawn
  - espawn
  - warp
  - ewarp
  - back
  - eback
  - dback
  - rtp
  - wild
  - top
  - jump
