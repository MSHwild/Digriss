# ───────────────────────── 국가전쟁 이벤트 ─────────────────────────
# 정해진 시간 동안 전쟁 점수와 전쟁 킬 보너스 영혼이 배로 늘어납니다.
# 수정 후 /전쟁이벤트 리로드 로 바로 적용됩니다.
#
# schedule: "요일 시작-끝" (한국 시간). 요일은 MONDAY ~ SUNDAY
#   예) "SATURDAY 20:00-22:00"
# 관리자는 /전쟁이벤트 시작 <분> 으로 언제든 직접 열 수 있습니다.

schedule:
  - "SATURDAY 20:00-22:00"
  - "SUNDAY 20:00-22:00"

# 전쟁 킬 1회당 전쟁 점수 배율 (2면 1킬 = 2점)
score-multiplier: 2

# 전쟁 킬 보너스 영혼 배율 (기본 5영혼 x 배율)
soul-multiplier: 2

# 시작 몇 분 전에 예고할지 (0이면 예고 안 함)
notice-minutes: 10
