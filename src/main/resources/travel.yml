# ───────────────────────── 이동 (워프 · 탈것) ─────────────────────────
# 맵(지구)이 넓어서 먼 곳은 워프 역참으로, 가까운 곳은 탈것으로 빠르게 다닐 수 있게 합니다.
# 수정 후 /디그리스 리로드 로 바로 적용됩니다.

# ── 워프 역참 (/워프) ──
# 역참을 골라 돈을 내고 순간이동. 먼 곳일수록 조금 더 비쌈
warp:
  warmup-seconds: 5        # 이동 전 대기 시간 (움직이거나 맞으면 취소)
  cooldown-seconds: 300    # 한 번 이동한 뒤 다시 쓸 수 있을 때까지 (5분)
  # 비용 기준: 쉬움 퀘스트 750원 · 보통 1800원 · 어려움 3750원, 국가 유지비 하루 100~500원
  # → 가까운 워프 = 어려움 퀘스트 1개 남짓, 지구 반대편 = 퀘스트 여러 개 (돈 쓰는 곳 역할)
  cost-min: 5000           # 기본 비용
  cost-per-1000: 1000      # 1000블록마다 추가 비용 (지구 둘레 약 18000블록)
  cost-max: 15000          # 최대 비용
  # 자원 거점 12곳을 역참으로 씀. 거점 중심에서 아래 거리만큼 떨어진 곳에 도착 (보호 구역 밖)
  include-sites: true
  site-offset: 30
  # 그 밖의 역참 "이름, x, z" (또는 "이름, 월드, x, z"). 그 자리 가장 높은 블록 위로 도착
  # 게임 안에서 /워프 추가 <이름> 으로 지금 서 있는 곳을 넣을 수도 있음 (빌드 없이, 재시작해도 유지)
  points: []

# ── 탈것 (/탈것) ──
# 빠른 말을 불러 타고 다님. 내리거나 나가면 사라짐
mount:
  speed: 0.4               # 이동 속도 (보통 말 0.11~0.34, 최고 속도 말 0.3375)
  jump: 0.9                # 점프력 (보통 말 0.4~1.0)
  health: 30               # 체력
  cooldown-seconds: 20     # 다시 부를 수 있을 때까지
  death-cooldown-seconds: 180  # 탈것이 죽었을 때 다시 부를 수 있을 때까지
