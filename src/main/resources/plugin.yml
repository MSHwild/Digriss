name: Digriss
version: '${version}'
main: kr.maeshil.digriss.Digriss
api-version: '1.21.1'
load: POSTWORLD
# 이 플러그인들보다 나중에 켜져야 연동이 정상 동작함 (없어도 서버는 켜짐)
softdepend: [Vault, ItemsAdder, BlueMap]
commands:
  영혼:
    description: 플레이어의 영혼을 지급/차감/설정합니다 (관리자)
    usage: /영혼 <지급|차감|설정> <닉네임> <수량>
    permission: digriss.admin
  랭킹:
    description: 서버 랭킹을 확인합니다
    usage: /랭킹
  어트리뷰트:
    description: 손에 든 아이템의 어트리뷰트 정보를 확인합니다
    usage: /어트리뷰트
  랭크:
    description: 자신의 랭크를 확인합니다
    usage: /랭크
  킬이펙트:
    description: 킬 이펙트 상점을 엽니다
    usage: /킬이펙트
  초기화:
    description: 모든 플레이어 데이터를 초기화합니다 (관리자)
    usage: /초기화
    permission: digriss.admin
  dc:
    description: DC 재화를 확인합니다 (관리자는 지급/차감 가능)
    usage: /dc [지급|차감 <닉네임> <수량>]
  직업:
    description: 직업 구매 상점을 엽니다
    usage: /직업
  직업설정:
    description: 구매한 직업 아이템을 장착하거나 해제합니다
    usage: /직업설정
  퀘스트:
    description: 일일 퀘스트 창을 엽니다
    usage: /퀘스트
  퀘스트관리:
    description: 플레이어의 오늘 퀘스트를 초기화합니다 (관리자)
    usage: /퀘스트관리 초기화 <닉네임>
    permission: digriss.admin
  연합:
    description: 국가 연합을 요청하고 관리합니다
    usage: /연합
  국가창고:
    description: 국가원이 함께 쓰는 국가 창고를 엽니다
    usage: /국가창고
  국가채팅:
    description: 같은 국가원에게만 보내는 채팅 (채팅창에 !메시지 도 가능)
    usage: /국가채팅 <메시지>
  연합채팅:
    description: 같은 국가와 연합국 국가원에게 보내는 채팅 (채팅창에 !!메시지 도 가능)
    usage: /연합채팅 <메시지>
  도움말:
    description: 서버 기능 도움말을 엽니다
    usage: /도움말 [카테고리]
  칭호:
    description: 업적 목록을 보고 칭호를 장착합니다
    usage: /칭호
    aliases:
      - 업적
  전쟁이벤트:
    description: 국가전쟁 이벤트 상태를 확인합니다 (관리자는 시작/종료)
    usage: /전쟁이벤트 [상태|시작 <분>|종료|리로드]
  아이콘:
    description: icons.yml을 다시 불러옵니다 (관리자)
    usage: /아이콘 리로드
    permission: digriss.admin
  번들:
    description: 판매 중인 번들(상점 패키지) 목록을 엽니다
    usage: /번들
  번들생성:
    description: 새 번들을 만듭니다. 열린 창에 아이템을 넣고 닫으면 저장 (관리자)
    usage: /번들생성 <이름> <가격(DC)> <기간(일), 0이면 무기한>
    permission: digriss.admin
  번들수정:
    description: 번들의 아이템을 수정합니다 (관리자)
    usage: /번들수정 <이름>
    permission: digriss.admin
  번들삭제:
    description: 번들을 삭제합니다 (관리자)
    usage: /번들삭제 <이름>
    permission: digriss.admin
  국가랭킹:
    description: 국가 순위를 확인합니다
    usage: /국가랭킹 [영토|금고|인원|레벨]
  국가:
    description: 국가 메뉴를 엽니다 (생성, 관리, 전쟁)
    usage: /국가
    aliases:
      - rnrrk
      - nation

permissions:
  digriss.admin:
    description: 디그리스 관리자 명령어 사용 권한
    default: op
