# ───────────────────────── 디그리스 대축제 (빅 이벤트) ─────────────────────────
# 정해진 날 하루 동안 열리는 축제입니다. 수정 후 /디그리스 리로드 로 바로 적용됩니다.
#   1) 접속 보상: 축제 동안 접속해 있으면 30분마다 영혼 · 돈 (하루 최대 횟수까지, 날마다 새로)
#   2) 새로 온 사람 환영 선물: 축제 기간에 처음 접속한 사람에게 한 번
#   3) 보스 레이드: 정해진 시간에 거대 보스 등장 → 함께 잡으면 참가자 전원 보상 + 피해량 1~3위 추가 보상
#      접속자가 적어도 잡을 수 있게 보스 체력은 접속자 수에 맞춰 정해집니다.
#
# 플레이어: /빅이벤트 이동 (레이드 중 보스에게 순간이동), /빅이벤트 귀환 (끝나고 10분 안에 원래 자리로)
# 관리자 명령어
#   /빅이벤트 위치                   보스 장소 목록
#   /빅이벤트 위치 추가 <이름>        지금 서 있는 곳을 장소로 추가 / 삭제 <이름>
#   /빅이벤트 보스 [장소]             지금 바로 보스 레이드 시작 (테스트용, 축제 날이 아니어도 됨)
#   /빅이벤트 종료                   진행 중인 보스 레이드 끝내기 (보상 없음)

enabled: true

# 축제 기간 (한국 시간). 이 기간 동안 매일 start ~ end 에 열림
# end-date 가 지나면 축제 기능은 완전히 쉬고 아무것도 하지 않습니다.
start-date: "2026-10-10"
end-date: "2026-10-11"
start: "00:00"
end: "23:59"

# 1) 접속 보상
playtime:
  every-minutes: 30   # 몇 분마다
  max-times: 6        # 하루 최대 몇 번 (6번 = 3시간)
  souls: 20
  money: 1000

# 2) 새로 온 사람 환영 선물 (축제 날 처음 접속한 사람)
welcome:
  souls: 100
  money: 5000
  dc: 2

# 3) 보스 레이드
boss:
  # 매일 등장 시간. 주말 전쟁 이벤트(20:00-22:00)와 겹치지 않게
  times: ["11:00", "13:00", "15:00", "17:00", "19:00", "22:15", "23:30"]

  # 등장 장소: "이름, x, z" (또는 "이름, 월드, x, z"). 그 자리 가장 높은 블록 위에 나옴
  # 레이드마다 직전과 다른 곳에서 무작위로 나오고, 10분 전 예고 때 장소를 미리 알려줌
  # 좌표: 자원 거점과 같은 방식 x = 경도 × 51.2, z = -위도 × 51.2
  # 게임 안에서 /빅이벤트 위치 추가 <이름> 으로 지금 서 있는 곳을 더 넣을 수도 있음
  locations:
    - "서울, 6501, -1924"
    - "후지산, 7103, -1810"
    - "에베레스트, 4451, -1433"
    - "타지마할, 3996, -1391"
    - "이집트 피라미드, 1594, -1535"
    - "사하라 사막, 512, -1178"
    - "케냐 사바나, 1797, 77"
    - "파리, 120, -2502"
    - "모스크바, 1926, -2855"
    - "뉴욕, -3789, -2084"
    - "그랜드 캐니언, -5740, -1849"
    - "알래스카, -7680, -3133"
    - "리우데자네이루, -2212, 1173"
    - "시드니, 7742, 1734"
  notice-minutes: 10        # 몇 분 전에 예고할지
  time-limit-minutes: 15    # 이 시간 안에 못 잡으면 보스가 도망감 (참가 보상만)
  name: "&4&l고대 수호자"
  base-health: 300          # 기본 체력
  health-per-player: 150    # 접속자 1명당 추가 체력 (최대 2000)
  damage: 9                 # 근접 공격력
  # 피해를 1이라도 준 사람 모두
  participation:
    souls: 50
    money: 3000
    dc: 1
  # 피해량 1위, 2위, 3위 추가 보상 (1위는 [축제의 영웅] 칭호)
  top-souls: [300, 200, 100]
  top-money: [15000, 10000, 5000]
  top-dc: [5, 3, 2]
