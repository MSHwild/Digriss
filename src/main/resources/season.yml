# ───────────────────────── 시즌 ─────────────────────────
# 시즌 종료일이 다가오면 자동으로 예고합니다. (전체 공지, 1일 이하부터 화면 제목, 디스코드 알림)
# 스코어보드에는 종료까지 남은 일수가 항상 보이고, join-notice-days 안으로 들어오면 접속 안내도 합니다.
# 실제 초기화는 자동으로 하지 않습니다. 종료 후 관리자가 직접 진행하세요.
# 수정 후 /디그리스 리로드

name: "프리시즌"

# 종료 일시 (한국 시간, "yyyy-MM-dd HH:mm"). 비워 두면 예고하지 않음
# 예) end-date: "2027-10-01 20:00"
end-date: ""

# 예고 시점 (d=일, h=시간, m=분). 종료일을 바꾸면 처음부터 다시 예고합니다
warn: ["30d", "14d", "7d", "3d", "1d", "12h", "1h", "10m", "1m"]

# 종료 며칠 전부터 접속할 때 안내하고, 스코어보드 남은 기간을 빨간색으로 보여줄지
join-notice-days: 30

# 예고할 때 같이 보여줄 안내
reset-text: "월드, 인벤토리, 돈, 영혼, 직업, 국가가 초기화됩니다. (DC · 칭호 · 킬 이펙트는 유지)"

# 시즌이 끝나면 OP가 아닌 사람은 접속할 수 없게 함 (이미 접속한 사람은 10초 뒤 내보냄)
# 새 시즌을 열 때: end-date를 새 날짜로 바꾸거나 lock-after-end: false 로 바꾼 뒤 /디그리스 리로드
lock-after-end: true
lock-message: "새 시즌을 준비 중입니다. 디스코드에서 오픈 소식을 확인해 주세요."
