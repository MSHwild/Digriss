# ───────────────────────── 시즌 ─────────────────────────
# 매년 같은 날짜에 자동으로 시즌이 끝나고, 개발 기간 동안 잠겼다가, 오픈일에 자동으로 열립니다.
#   종료일 → 서버 잠금 (OP만 접속) → 관리자가 /초기화 시즌 + 월드 교체 → 오픈일에 자동 오픈 (시즌 번호 +1)
# /초기화 시즌 을 안 했으면 오픈일이 돼도 열리지 않고 OP에게 경고합니다.
# 수정 후 /디그리스 리로드
#
# 관리자 명령어
#   /시즌 종료일 2027-10-31 23:59   이번 시즌 종료일만 바꾸기
#   /시즌 오픈일 2028-01-01 00:00   이번 오픈일만 바꾸기 (잠겨 있을 때)
#   /시즌 오픈 [강제]               지금 바로 오픈 (강제: 초기화 안 했어도 오픈)

# 지금 시즌 번호 (처음 한 번만 읽음. 이후로는 오픈할 때마다 자동으로 1씩 올라감)
season: 3

# 매년 종료 / 오픈 날짜 (한국 시간, "MM-dd HH:mm")
end: "10-31 23:59"
open: "01-01 00:00"

# 시즌 최소 길이(일). 오픈 후 이 기간이 지난 뒤의 첫 종료일에 끝남 (첫 시즌이 너무 짧아지는 것 방지)
min-season-days: 180

# 종료 예고 시점 (d=일, h=시간, m=분). 전체 공지 + 1일 이하부터 화면 제목 + 디스코드
warn: ["30d", "14d", "7d", "3d", "1d", "12h", "1h", "10m", "1m"]

# 오픈 예고 시점 (디스코드 알림)
open-warn: ["14d", "7d", "3d", "1d", "1h", "10m"]

# 종료 며칠 전부터 접속할 때 안내하고, 스코어보드 남은 기간을 빨간색으로 보여줄지
join-notice-days: 30

# 종료 예고할 때 같이 보여줄 안내
reset-text: "DC를 뺀 모든 것(월드, 아이템, 돈, 영혼, 직업, 국가, 랭크, 칭호, 킬 이펙트)이 초기화됩니다."

# 잠겨 있을 때 접속하려는 사람에게 보여줄 안내 (오픈까지 남은 시간은 자동으로 붙음)
lock-message: "다음 시즌을 준비 중입니다. 디스코드에서 오픈 소식을 확인해 주세요."
