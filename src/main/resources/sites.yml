# ───────────────────────── 자원 거점 ─────────────────────────
# 실제 지구 지명 위치에 있는 거점. 반경 안에 한 국가의 국가원만 있으면 점령 게이지가 찹니다.
# 다른 국가 사람이 같이 있으면 교전 중이라 멈추고, 주인 국가가 지키면 게이지가 빨리 줄어요.
# 수정 후 /디그리스 리로드 로 바로 적용됩니다. (점령 주인은 sites-data.yml에 저장)
#
# 좌표: 지도는 1도 = 51.2블록.  x = 경도 × 51.2,  z = -위도 × 51.2
# rewards: "아이템이름:개수" (매일 자정 국가 창고로)

capture-seconds: 300   # 점령에 걸리는 시간(초)
radius: 15             # 점령 범위(블록)
protect-radius: 20     # 건축·파괴·영토 점령이 금지되는 범위(블록)
daily-money: 1000      # 매일 자정 주인 국가 금고에 들어가는 돈
daily-peace: 5         # 매일 주는 내실 점수

