# ───────────────────────── 서버 투표 보상 ─────────────────────────
# 마인리스트 같은 서버 목록 사이트에서 투표하면 보상을 줍니다.
# 서버에 NuVotifier 플러그인이 있어야 투표 신호를 받을 수 있습니다.
# 투표한 사람이 접속 중이 아니면 다음 접속 때 지급합니다.
# 수정 후 /디그리스 리로드  ·  테스트: /투표 테스트 <닉네임>

enabled: true

# /투표 에서 보여줄 투표 페이지 주소 (마인리스트 서버 페이지)
vote-url: ""

# 이 사이트에서 온 투표만 인정 (비우면 모든 사이트 인정). 이름은 vote.log 에 찍힌 값을 보고 넣으세요
services: []

rewards:
  souls: 30
  dc: 2
  money: 0
  # 콘솔로 실행할 명령어 ({player} = 닉네임)
  commands: []

# 누가 투표하면 전체 공지
broadcast: true
