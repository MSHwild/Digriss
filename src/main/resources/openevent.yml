# ───────────────────────── 오픈 이벤트 ─────────────────────────
# 수정 후 /디그리스 리로드 로 바로 적용됩니다.
# enabled: false 로 바꾸거나 end-date 가 지나면 자동으로 멈춥니다.

enabled: true

# 이벤트 마지막 날 (예: "2026-11-01"). 비워 두면 계속 진행
end-date: ""

# 1) 매일 첫 접속 보상 (한국 시간 0시 기준 하루 한 번)
login:
  souls: 10
  dc: 1

# 2) 친구 추천: 새로 온 사람이 /추천 <초대한 사람 닉네임>
invite:
  window-hours: 72          # 처음 접속한 뒤 몇 시간 안에만 입력할 수 있는지
  min-playtime-minutes: 10  # 몇 분 이상 플레이해야 입력할 수 있는지 (가짜 계정 방지)
  block-same-ip: true       # 같은 주소(같은 집)끼리는 추천 불가 (부계정 방지)
  newcomer-souls: 100       # 새로 온 사람 보상
  newcomer-dc: 3
  inviter-souls: 100        # 초대한 사람 보상
  inviter-dc: 5
  inviter-max: 10           # 한 사람이 보상을 받을 수 있는 최대 인원
